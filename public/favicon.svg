<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Obsidian Cyber-Glass Rounded Background -->
  <rect width="32" height="32" rx="8" fill="#090d16"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  
  <defs>
    {/* Ambient radial core glow */}
    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    {/* Cyan to sky gradient for S */}
    <linearGradient id="favSCyanGrad" x1="18" y1="9.5" x2="27" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    {/* Cyan Glow Filter */}
    <filter id="favCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.6" flood-color="#00f0ff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <circle cx="16" cy="16" r="13" fill="url(#favCoreGlow)"/>

  <!-- 'T' Letterform: Crisp Solid White -->
  <rect x="4.5" y="6.5" width="17.5" height="4" rx="1.5" fill="#ffffff"/>
  <rect x="11" y="9.5" width="4.2" height="15.5" rx="1.5" fill="#ffffff"/>

  <!-- 'S' Letterform: Smooth Dynamic Cyan Curve -->
  <path
    d="M 18.5 12.8 C 18.5 10.8 20.2 9.5 22.8 9.5 C 25.5 9.5 27 11 27 13.2 C 27 16.2 18 17.5 18 21.2 C 18 23.6 20 25.2 23 25.2 C 25.8 25.2 27.2 23.6 27.2 21.8"
    stroke="url(#favSCyanGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favCyanGlow)"
  />
</svg>
